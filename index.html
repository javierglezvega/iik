	    function obtenerCodigoDelDia() {
			const hoy = new Date();
			const dia = String(hoy.getDate()).padStart(2, '0');
			const mes = String(hoy.getMonth() + 1).padStart(2, '0');
			return dia + mes;
	    }
	    function verificarCodigo() {
			const input = document.getElementById("codigo");
			const codigoIngresado = input.value.trim();
			const codigoCorrecto = obtenerCodigoDelDia();
			if (codigoIngresado === codigoCorrecto) {
				document.getElementById("contenedor_introducir_codigo").style.display = "none";
				document.getElementById("contenedor_general").style.display = "block";
			} else {
				// Activar animación shake
				input.classList.add("shake");
				// Quitar la clase después de la animación para permitir reutilizarla
				setTimeout(() => {
					input.classList.remove("shake");
				}, 300);
			}
		}
